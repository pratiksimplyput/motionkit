name: Build Mac ZXP
on:
  push:
    branches: [main]
    paths:
      - 'panel/**'
      - 'host/**'
      - 'CSXS/**'
      - '.github/workflows/build-zxp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check and test
        run: |
          npm run check
          npm test
      - name: Get Adobe signing tool from pinned official source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Adobe-CEP/CEP-Resources.git "$RUNNER_TEMP/adobe-cep"
          git -C "$RUNNER_TEMP/adobe-cep" checkout ab5e4e3e53a42fad08e1225a22a991bb1ffe73f6 -- ZXPSignCMD/4.1.3/macOS/ZXPSignCmd
          cp "$RUNNER_TEMP/adobe-cep/ZXPSignCMD/4.1.3/macOS/ZXPSignCmd" "$RUNNER_TEMP/ZXPSignCmd"
          chmod +x "$RUNNER_TEMP/ZXPSignCmd"
      - name: Sign and verify development ZXP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/motionkit-payload" dist
          cp -R CSXS panel host "$RUNNER_TEMP/motionkit-payload/"
          # Ephemeral self-signed development identity; no publisher trust claim.
          cert_password="$(openssl rand -hex 24)"
          echo "::add-mask::$cert_password"
          "$RUNNER_TEMP/ZXPSignCmd" -selfSignedCert US California SimplyPut "MotionKit Development" "$cert_password" "$RUNNER_TEMP/motionkit-dev.p12"
          "$RUNNER_TEMP/ZXPSignCmd" -sign "$RUNNER_TEMP/motionkit-payload" dist/MotionKit-Mac-0.1.0-dev.zxp "$RUNNER_TEMP/motionkit-dev.p12" "$cert_password"
          "$RUNNER_TEMP/ZXPSignCmd" -verify dist/MotionKit-Mac-0.1.0-dev.zxp
          rm -f "$RUNNER_TEMP/motionkit-dev.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: MotionKit-Mac-ZXP
          path: dist/MotionKit-Mac-0.1.0-dev.zxp
          if-no-files-found: error
